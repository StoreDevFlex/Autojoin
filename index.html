    :root {
      --bg-color: #0d0a12;
      --panel-bg: rgba(22, 16, 29, 0.65);
      --panel-border: rgba(255, 182, 193, 0.15);
      --accent-color: #ff75a0;
      --accent-hover: #ff5288;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }
